name: Build sing-box & APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'

      - name: Set NDK environment variable
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Clone sing-box source
        run: git clone --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box

      - name: Build libbox.aar
        run: |
          echo "$HOME/go/bin" >> $GITHUB_PATH
          export PATH="$HOME/go/bin:$PATH"
          cd /tmp/sing-box
          make lib_install
          make lib_android

      - name: Copy libbox.aar to project
        run: |
          mkdir -p app/libs
          AAR=$(find /tmp/sing-box -name libbox.aar | head -n1)
          echo "Found: $AAR"
          test -n "$AAR"
          cp "$AAR" app/libs/libbox.aar
          ls -lh app/libs/libbox.aar

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
