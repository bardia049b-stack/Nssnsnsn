name: Build APK with sing-box Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK r28b
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install gomobile & gobind
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Clone sing-box v1.14.2
        run: |
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          git submodule update --init --recursive --depth 1

      - name: Build libbox.aar (fat AAR)
        id: build_libbox
        timeout-minutes: 90
        run: |
          cd /tmp/sing-box
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108

          go run ./cmd/internal/build_libbox -platform android/arm64 -o /tmp/libbox-arm64.aar
          go run ./cmd/internal/build_libbox -platform android/arm -o /tmp/libbox-armv7.aar
          go run ./cmd/internal/merge_aar -o /tmp/libbox.aar /tmp/libbox-arm64.aar /tmp/libbox-armv7.aar

          mkdir -p ${{ github.workspace }}/app/libs
          cp /tmp/libbox.aar ${{ github.workspace }}/app/libs/libbox.aar
          ls -lh ${{ github.workspace }}/app/libs/libbox.aar

      - name: Verify libbox.aar
        run: |
          file ${{ github.workspace }}/app/libs/libbox.aar
          unzip -l ${{ github.workspace }}/app/libs/libbox.aar | head -10

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK with full logs
        id: build_apk
        timeout-minutes: 60
        run: |
          cd ${{ github.workspace }}
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          else
            ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -n "$APK_PATH" ]; then
            APK_NAME="NebulaBox-${BUILD_TYPE}-${{ github.sha }}.apk"
            cp "$APK_PATH" "$APK_NAME"
            echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
            ls -lh "$APK_NAME"
          else
            echo "::error::APK not found!"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            ${{ steps.build_apk.outputs.apk_path }}
            app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libbox-fat-aar
          path: ${{ github.workspace }}/app/libs/libbox.aar
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build.log
            app/build/reports/
          retention-days: 7
