name: build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: publish a release when the build is done
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  CORE_VERSION: v26.9.30
  CORE_SHA256: cf71680b776b9ca583747ba652f816b047a655eab875d8951e6141636d88bbd6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check the source out
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Find the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -eo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            path="$RUNNER_TEMP/javidtun.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$path"
          elif [ -f keystore/nebula.keystore ]; then
            path="$GITHUB_WORKSPACE/keystore/nebula.keystore"
            echo "::warning::signing with the key that sits inside the repository, it belongs in the secrets"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no signing key in this repository, so there is nothing to build here. Put APP_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD under Settings, Secrets and variables, Actions and the build turns itself on."
            exit 0
          fi
          if ! keytool -list -keystore "$path" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::the password does not open the signing key"
            exit 0
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Read the version
        if: steps.key.outputs.ready == 'true'
        run: |
          VERSION=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep -E '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "building $VERSION with the install number $CODE"

      - name: Keep the core between runs
        if: steps.key.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: core-${{ env.CORE_VERSION }}-${{ env.CORE_SHA256 }}

      - name: Fetch the core
        if: steps.key.outputs.ready == 'true'
        run: |
          set -eo pipefail
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.CORE_VERSION }}/libv2ray.aar"
          fi
          echo "${{ env.CORE_SHA256 }}  app/libs/libv2ray.aar" | sha256sum -c -
          ls -lh app/libs/libv2ray.aar

      - name: Check the geo data
        if: steps.key.outputs.ready == 'true'
        run: python3 tools/check_geo_assets.py

      - name: Build
        if: steps.key.outputs.ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ steps.key.outputs.path }} \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" 2>&1 | tee build.log

      - name: Collect the apks and look inside them
        if: steps.key.outputs.ready == 'true'
        run: |
          set -eo pipefail
          BT=$(dirname "$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort | tail -1)")
          mkdir -p out
          for apk in app/build/outputs/apk/fdroid/release/*.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -1)
            cp "$apk" "out/JavidTun-${VERSION}-${CODE}-${abi:-universal}.apk"
          done
          ls -l out

          status=0
          codes=""
          for apk in out/*.apk; do
            name=$(basename "$apk")
            arch=$(echo "$name" | sed -E "s/^JavidTun-.*-${CODE}-(.*)\.apk$/\1/")
            entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
            echo "--- $name ($(stat -c%s "$apk") bytes)"
            "$BT/apksigner" verify --print-certs "$apk" | grep -E "Verified using|Signer #1 certificate SHA-256" | sed 's/^/    /' || true
            if [ "$arch" = "universal" ]; then
              for abi in arm64-v8a armeabi-v7a x86 x86_64; do
                echo "$entries" | grep -qx "lib/$abi/libgojni.so" || { echo "::error::$name does not carry the $abi core"; status=1; }
              done
            else
              echo "$entries" | grep -qx "lib/$arch/libgojni.so" || { echo "::error::$name does not carry lib/$arch/libgojni.so"; status=1; }
              others=$(echo "$entries" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | grep -vx "$arch" | grep -v '^$' || true)
              if [ -n "$others" ]; then
                echo "::error::$name also carries the cores of $others"
                status=1
              fi
            fi
            code=$("$BT/aapt2" dump badging "$apk" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" || true)
            echo "    install number ${code:-unknown}"
            codes="$codes $code"
          done

          total=$(ls out/*.apk | wc -l)
          [ "$total" -eq 5 ] || { echo "::error::expected five apks, found $total"; status=1; }
          unique=$(echo $codes | tr ' ' '\n' | sort -u | sed '/^$/d' | wc -l)
          [ "$unique" -eq "$total" ] || { echo "::error::the apks do not all carry an install number of their own"; status=1; }
          exit $status

      - name: Sign the files for the release
        if: steps.key.outputs.ready == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -eo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "signing with $KEY"
          for apk in out/*.apk; do
            gpg --batch --yes --local-user "$KEY" --armor --detach-sign --output "$apk.sig" "$apk"
          done
          gpg --armor --export "$KEY" > out/JavidTun-public-key.asc
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Keep the apks here
        if: steps.key.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: javidtun-apks
          path: out/
          retention-days: 30

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      - name: Publish the release
        if: steps.key.outputs.ready == 'true' && (github.ref_type == 'tag' || inputs.publish == 'yes')
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ env.VERSION }}
          name: JavidTun ${{ env.VERSION }}
          body: |
            **JavidTun ${{ env.VERSION }}**, install number ${{ env.CODE }}.

            One file for every architecture, so you only download the core your phone needs, and a
            universal file for when you are not sure:

            | file | for |
            | --- | --- |
            | `...-arm64-v8a.apk` | most phones of the last years |
            | `...-armeabi-v7a.apk` | older 32 bit phones |
            | `...-x86_64.apk` | emulators and tablets |
            | `...-x86.apk` | old emulators |
            | `...-universal.apk` | every core in one file, installs anywhere |

            Every apk has a detached signature next to it, the public key that checks them is
            `JavidTun-public-key.asc`, and `SHA256SUMS.txt` holds the hashes:

            ```
            gpg --import JavidTun-public-key.asc
            gpg --verify JavidTun-....apk.sig JavidTun-....apk
            sha256sum -c SHA256SUMS.txt
            ```

            یک فایل برای هر معماری؛ اگر مطمئن نیستید گوشی‌تان کدام را می‌خواهد، فایل universal را
            بردارید. امضای جدا، کلید عمومی و فهرست هش‌ها هم همراه هر نسخه هست.

            The tunnel core is Xray, built by the AndroidLibXrayLite project at tag
            `${{ env.CORE_VERSION }}`; the build downloads it and checks its hash before using it.
          files: |
            out/*.apk
            out/*.sig
            out/JavidTun-public-key.asc
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
