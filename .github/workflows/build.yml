name: Build and Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CORE_VERSION: v26.9.30
  CORE_SHA256: cf71680b776b9ca583747ba652f816b047a655eab875d8951e6141636d88bbd6

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache the Xray core
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: core-${{ env.CORE_VERSION }}-${{ env.CORE_SHA256 }}

      - name: Fetch the Xray core
        run: |
          set -eo pipefail
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            curl -fL --retry 3 -o app/libs/libv2ray.aar \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.CORE_VERSION }}/libv2ray.aar"
          fi
          echo "${{ env.CORE_SHA256 }}  app/libs/libv2ray.aar" | sha256sum -c -
          ls -lh app/libs/libv2ray.aar

      - name: Check the geo data
        run: python3 tools/check_geo_assets.py

      - name: Put the signing key in place
        id: signing
        run: |
          set -eo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            path="$RUNNER_TEMP/javidtun.jks"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$path"
            echo "signing with the key from the repository secrets"
          else
            path="$GITHUB_WORKSPACE/keystore/nebula.keystore"
            echo "::warning::no keystore secret, falling back to the key inside the repository"
          fi
          if [ ! -f "$path" ]; then
            echo "::error::there is no signing key, the apks would not be installable"
            exit 1
          fi
          keytool -list -keystore "$path" -storepass "$STORE_PASSWORD" > /dev/null
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build one APK per architecture
        run: |
          set -eo pipefail
          chmod +x gradlew
          ./gradlew assembleFdroidRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ steps.signing.outputs.path }} \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" 2>&1 | tee build.log

      - name: Collect and check the APKs
        run: |
          set -eo pipefail
          VERSION=$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          CODE=$(grep -E '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          BT=$(dirname "$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort | tail -1)")
          mkdir -p out
          for apk in app/build/outputs/apk/fdroid/release/*.apk; do
            [ -f "$apk" ] || continue
            abi=$(basename "$apk" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64|x86' | head -1)
            if [ -z "$abi" ]; then
              echo "::error::cannot tell the architecture of $(basename "$apk")"
              exit 1
            fi
            cp "$apk" "out/JavidTun-${VERSION}-${CODE}-fdroid_${abi}.apk"
          done
          ls -l out

          status=0
          codes=""
          for apk in out/*.apk; do
            name=$(basename "$apk")
            case "$name" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *x86*) abi=x86 ;;
              *) echo "::error::cannot tell the architecture of $name"; status=1; continue ;;
            esac
            entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
            size=$(stat -c%s "$apk")
            echo "--- $name ($size bytes)"
            "$BT/apksigner" verify --print-certs "$apk" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" | sed 's/^/    /' || true
            echo "$entries" | sed 's/^/    /'
            if ! echo "$entries" | grep -qx "lib/$abi/libgojni.so"; then
              echo "::error::$name does not carry lib/$abi/libgojni.so"
              status=1
            fi
            others=$(echo "$entries" | sed -n 's|^lib/\([^/]*\)/.*|\1|p' | sort -u | grep -vx "$abi" || true)
            if [ -n "$others" ]; then
              echo "::error::$name also carries $others"
              status=1
            fi
            code=$("$BT/aapt2" dump badging "$apk" 2>/dev/null | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" || true)
            echo "    versionCode ${code:-unknown}"
            codes="$codes $code"
          done
          total=$(ls out/*.apk | wc -l)
          if [ "$total" -ne 4 ]; then
            echo "::error::expected four architectures, found $total"
            status=1
          fi
          unique=$(echo $codes | tr ' ' '\n' | sort -u | sed '/^$/d' | wc -l)
          if [ "$unique" -ne "$total" ]; then
            echo "::error::the four apks do not carry four different version codes"
            status=1
          fi
          exit $status

      - name: Sign everything for the release
        run: |
          set -eo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          echo "signing with $KEY"
          for apk in out/*.apk; do
            gpg --batch --yes --local-user "$KEY" --armor --detach-sign --output "$apk.sig" "$apk"
          done
          gpg --armor --export "$KEY" > out/JavidTun-public-key.asc
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0-${{ env.BUILD_NUMBER }}
          name: JavidTun 2.1.0-${{ env.BUILD_NUMBER }}
          body: |
            **JavidTun 2.1.0** — build ${{ env.BUILD_NUMBER }}

            یک فایل برای هر معماری، پس فقط هسته‌ی گوشی خودتان دانلود می‌شود:

            | فایل | برای |
            | --- | --- |
            | `...-fdroid_arm64-v8a.apk` | بیشتر گوشی‌های امروزی |
            | `...-fdroid_armeabi-v7a.apk` | گوشی‌های ۳۲ بیتی قدیمی‌تر |
            | `...-fdroid_x86_64.apk` | شبیه‌سازها و تبلت‌ها |
            | `...-fdroid_x86.apk` | شبیه‌سازهای قدیمی |

            هر فایل امضای جدا (`*.apk.sig`) و کلید عمومی (`JavidTun-public-key.asc`) دارد و
            `SHA256SUMS.txt` هش همه‌ی فایل‌ها را نگه می‌دارد:

            ```
            gpg --import JavidTun-public-key.asc
            gpg --verify JavidTun-....apk.sig JavidTun-....apk
            sha256sum -c SHA256SUMS.txt
            ```

            هسته‌ی تونل Xray است که پروژه‌ی AndroidLibXrayLite (تگ `${{ env.CORE_VERSION }}`) می‌سازد و
            هنگام بیلد دانلود و هش‌بررسی می‌شود. مجوز همه‌چیز در `THIRD_PARTY_LICENSES.md` آمده است.
          files: |
            out/*.apk
            out/*.sig
            out/JavidTun-public-key.asc
            out/SHA256SUMS.txt
          fail_on_unmatched_files: true
