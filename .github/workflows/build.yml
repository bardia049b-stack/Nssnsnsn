name: Build APK with sing-box Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Set NDK environment variable
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Clone sing-box source
        run: git clone --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('/tmp/sing-box/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install gomobile & gobind
        run: |
          cd /tmp/sing-box
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Build libbox.aar
        run: |
          cd /tmp/sing-box
          make lib_install
          make lib_android
          ls -lh /tmp/sing-box/build/libbox.aar

      - name: Copy and verify libbox.aar
        run: |
          mkdir -p app/libs
          cp /tmp/sing-box/build/libbox.aar app/libs/libbox.aar
          ls -lh app/libs/libbox.aar

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: |
            build/reports/
            app/build/reports/
          retention-days: 7
