name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK r28b
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile & gobind
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Clone sing-box v1.14.2
        run: |
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          git submodule update --init --recursive --depth 1

      - name: Build libbox.aar (arm64)
        run: |
          cd /tmp/sing-box
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p ${{ github.workspace }}/app/libs
          cp libbox.aar ${{ github.workspace }}/app/libs/
          ls -lh ${{ github.workspace }}/app/libs/libbox.aar

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/gradlew

      - name: Build APK
        id: build_apk
        run: |
          cd ${{ github.workspace }}
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          else
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -n "$APK_PATH" ]; then
            APK_NAME="NebulaBox-${BUILD_TYPE}-${{ github.sha }}.apk"
            cp "$APK_PATH" "$APK_NAME"
            echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
            echo "::notice::APK built: $APK_NAME ($(stat -c%s "$APK_NAME") bytes)"
          else
            echo "::error::APK not found!"
            find app/build/outputs -name "*.apk" || true
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.build_apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          name: NebulaBox ${{ github.sha }}
          tag_name: v1.0.0-${{ github.sha }}
          body: |
            **NebulaBox - Android VPN Client**

            - Built with sing-box v1.14.2
            - ARM64 support
            - Full protocol support (VLESS, VMess, Trojan, Shadowsocks, WireGuard, etc.)
          files: |
            ${{ steps.build_apk.outputs.apk_path }}
          fail_on_unmatched_files: false
          prerelease: false
          draft: false

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
