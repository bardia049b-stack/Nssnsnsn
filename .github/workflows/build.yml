name: Build APK with sing-box Engine (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK r28b
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install gomobile & gobind
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Clone sing-box v1.14.2
        run: |
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          git submodule update --init --recursive --depth 1

      - name: Build libbox.aar (arm64)
        timeout-minutes: 60
        run: |
          cd /tmp/sing-box
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p ${{ github.workspace }}/app/libs
          cp libbox.aar ${{ github.workspace }}/app/libs/
          ls -lh ${{ github.workspace }}/app/libs/libbox.aar

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/gradlew

      - name: Build APK
        id: build_apk
        run: |
          cd ${{ github.workspace }}
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build.log
          else
            ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ github.event.inputs.build_type || 'debug' }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libbox-arm64
          path: ${{ github.workspace }}/app/libs/libbox.aar
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build.log
          retention-days: 7
