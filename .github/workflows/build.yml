name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
        - release
        - debug

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Core Archive
        id: cache-core
        uses: actions/cache@v4
        with:
          path: app/libs/libv2ray.aar
          key: core-v26.9.30-v1

      - name: Download Core Archive
        if: steps.cache-core.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ github.workspace }}/app/libs
          curl -fL --retry 3 -o ${{ github.workspace }}/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.30/libv2ray.aar"
          ls -lh ${{ github.workspace }}/app/libs/libv2ray.aar

      - name: Check geo data
        run: python3 ${{ github.workspace }}/tools/check_geo_assets.py

      - name: Grant execute permission
        run: chmod +x ${{ github.workspace }}/gradlew

      - name: Build APK
        id: build_apk
        run: |
          set -eo pipefail
          cd ${{ github.workspace }}
          ls -lh app/libs/libv2ray.aar
          ls -lh app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
            APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          else
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
            APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          fi

          if [ -n "$APK_PATH" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            APK_NAME="JavidTun-${BUILD_TYPE}-${SHORT_SHA}.apk"
            cp "$APK_PATH" "$APK_NAME"
            echo "apk_path=$APK_NAME" >> $GITHUB_OUTPUT
            echo "::notice::APK built: $APK_NAME ($(stat -c%s "$APK_NAME") bytes)"
          else
            echo "::error::APK not found!"
            find app/build/outputs -name "*.apk" || true
            exit 1
          fi

      - name: Upload APK Artifact
        if: steps.build_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: JavidTun-APK
          path: ${{ steps.build_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release
        if: steps.build_apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          name: JavidTun v2.1.0-${{ github.run_number }}
          tag_name: v2.1.0-${{ github.run_number }}
          body: |
            **JavidTun v2.1.0 build ${{ github.run_number }}**

            - Smaller package: trimmed geoip data, no ML Kit, R8 shrinking
            - Subscription quota bar with usage and expiry
            - Connection is shown as online only after traffic really passes
            - Persian interface
          files: |
            ${{ steps.build_apk.outputs.apk_path }}
          fail_on_unmatched_files: false
          prerelease: false
          draft: false

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
