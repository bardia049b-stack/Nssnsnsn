org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=96m -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
org.gradle.workers.max=1
org.gradle.kotlin.dsl.scriptCompilationAvoidance=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.experimental.disableCompileSdkChecks=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
APP_VERSION_NAME=2.1.0
APP_VERSION_CODE=43

# The Kotlin compiler runs inside the Gradle process on the build machines too, the separate
# compiler daemon is what runs out of code cache there.
kotlin.compiler.execution.strategy=in-process
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=480m -Dfile.encoding=UTF-8
